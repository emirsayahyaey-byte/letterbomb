  .lsidebar::-webkit-scrollbar{width:3px;}

  .top-bar{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-family:'Fredoka One',cursive;font-size:22px;
    background:linear-gradient(90deg,#FF3CAC,#FFD200,#00C9FF);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

  .lang-btn{display:flex;gap:4px;}
  .lang-btn button{background:#1a1a2e;border:2px solid #2a2a4a;border-radius:8px;
    color:#aaaacc;font-family:'Fredoka One',cursive;font-size:12px;padding:4px 9px;
    cursor:pointer;transition:background 0.15s,border-color 0.15s,color 0.15s;}
  .lang-btn button.active{background:linear-gradient(135deg,#FF3CAC,#784BA0);
    border-color:#FF3CAC;color:#fff;}
  .lang-btn button:hover:not(.active){background:#2a2a4a;color:#fff;}

  .flabel{color:#666688;font-size:10px;font-weight:900;text-transform:uppercase;
    letter-spacing:1.5px;margin-bottom:5px;display:block;}
  #nameInput{width:100%;background:#0c0c18;border:2px solid #2a2a4a;border-radius:11px;

  #nameInput:focus{border-color:#FF3CAC;}

  @keyframes rowIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
  .lbadge{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;

  .lname{color:#9999bb;font-weight:700;font-size:11px;flex:1;}
  .count-ctrl{display:flex;align-items:center;gap:4px;}
  .cbtn{width:22px;height:22px;border-radius:5px;border:none;background:#222244;color:#fff;

  .bomb-spark{position:absolute;top:-22px;right:7px;font-size:12px;

  .bomb-label{font-family:'Fredoka One',cursive;font-size:12px;color:#ffffffcc;
    text-align:center;max-width:84px;word-break:break-all;
    text-shadow:0 1px 5px rgba(0,0,0,0.9);line-height:1.2;}

  /* FLASH overlay (single reused element) */
  #flashEl{position:fixed;inset:0;pointer-events:none;z-index:9998;opacity:0;
    transition:opacity 0.05s;}
</style>

      {cat:"animals",icon:"🐘",name:"Elephant"},{cat:"animals",icon:"🦁",name:"Lion"},
      {cat:"animals",icon:"🐸",name:"Frog"},{cat:"animals",icon:"🐧",name:"Penguin"},

let lang='tr';
function setLang(l){
  lang=l;
  document.getElementById('btnTR').classList.toggle('active',l==='tr');
  document.getElementById('btnEN').classList.toggle('active',l==='en');
  const t=T[l];
  document.getElementById('logoText').textContent=t.logo;
  document.getElementById('labelName').textContent=t.labelName;
  document.getElementById('labelCount').textContent=t.labelCount;
  document.getElementById('nameInput').placeholder=t.placeholder;
  document.getElementById('createBtnTxt').textContent=t.createBtn;
  document.getElementById('explodeAllTxt').textContent=t.explodeAll;
  document.getElementById('panelToggleLabel').textContent=t.panelLabel;
  document.getElementById('sbHint').innerHTML=t.hint.replace(/\n/g,'<br>');
  buildPanel();
  updateLetterRows(document.getElementById('nameInput').value);
}

/* ════════════════════════════════════════
   CANVAS PARTICLE ENGINE
════════════════════════════════════════ */
const canvas=document.getElementById('particleCanvas');
const ctx=canvas.getContext('2d');
let particles=[];
let rafId=null;
const MAX_PARTICLES=600; // hard cap

function resizeCanvas(){
  const sb=document.getElementById('sandbox');
  canvas.width=sb.clientWidth;
  canvas.height=sb.clientHeight;
}
resizeCanvas();
window.addEventListener('resize',resizeCanvas,{passive:true});

// Pre-load font so canvas renders correctly
document.fonts.ready.then(()=>{ /* font ready */ });

function spawnParticles(cx,cy,snap){
  // cx/cy are in viewport coords; convert to canvas coords
  const rect=canvas.getBoundingClientRect();
  const lx=cx-rect.left, ly=cy-rect.top;

  // Count total new particles and respect cap
  let total=0;
  Object.values(snap).forEach(({count})=>total+=count);
  const scale=Math.min(1, (MAX_PARTICLES-particles.length)/Math.max(total,1));

  Object.entries(snap).forEach(([letter,{count,color}])=>{
    const n=Math.round(count*scale);
    for(let j=0;j<n;j++){
      const angle=Math.random()*Math.PI*2;
      const speed=8+Math.random()*16;
      particles.push({
        x:lx, y:ly,
        vx:Math.cos(angle)*speed,
        vy:Math.sin(angle)*speed,
        spin:(Math.random()-0.5)*10,
        rot:Math.random()*360,
        size:20+Math.random()*34,
        letter,color,alpha:1,life:1,
        decay:0.010+Math.random()*0.007,
      });
    }
  });

  if(!rafId) rafId=requestAnimationFrame(tickParticles);
}

function tickParticles(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const gravity=0.04;
  let alive=false;

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life-=p.decay;
    if(p.life<=0){ particles.splice(i,1); continue; }
    alive=true;
    p.vy+=gravity;
    p.x+=p.vx;
    p.y+=p.vy;
    p.rot+=p.spin;
    p.vx*=0.94;
    p.vy*=0.94;
    p.alpha=p.life;

    ctx.save();
    ctx.globalAlpha=p.alpha;
    ctx.translate(p.x,p.y);
    ctx.rotate(p.rot*Math.PI/180);
    ctx.font=`900 ${p.size}px 'Fredoka One', cursive`;
    ctx.fillStyle=p.color;
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.shadowColor='rgba(0,0,0,0.4)';
    ctx.shadowBlur=4;
    ctx.fillText(p.letter,0,0);
    ctx.restore();
  }

  if(alive){
    rafId=requestAnimationFrame(tickParticles);
  } else {
    rafId=null;
    ctx.clearRect(0,0,canvas.width,canvas.height);
  }
}

/* ════════════════════════════════════════
   FLASH (single reused element)
════════════════════════════════════════ */
const flashEl=document.getElementById('flashEl');
let flashTimer=null;
function doFlash(cx,cy){
  if(flashTimer) clearTimeout(flashTimer);
  flashEl.style.backgroundImage=`radial-gradient(circle at ${cx}px ${cy}px,rgba(255,210,0,0.65),transparent 48%)`;
  flashEl.style.opacity='1';
  flashEl.style.transition='opacity 0.05s';
  flashTimer=setTimeout(()=>{
    flashEl.style.transition='opacity 0.35s';
    flashEl.style.opacity='0';
  },60);
}

/* ════════════════════════════════════════
   PANEL
════════════════════════════════════════ */
function buildPanel(){
  const t=T[lang], grid=document.getElementById('itemsGrid');
  grid.innerHTML='';
  const frag=document.createDocumentFragment();
  let lastCat=null;
  t.items.forEach(item=>{
    if(item.cat!==lastCat){
      lastCat=item.cat;
      const lbl=document.createElement('div');
      lbl.className='cat-label';
      lbl.textContent=t.cats[item.cat];
      frag.appendChild(lbl);
    }
    const el=document.createElement('div');
    el.className='ritem';
    el.innerHTML=`<span class="ritem-icon">${item.icon}</span><span class="ritem-name">${item.name}</span>`;
    el.onclick=()=>spawnObject(item.icon,item.name);
    frag.appendChild(el);
  });
  grid.appendChild(frag);
}
function togglePanel(){ document.getElementById('rpanel').classList.toggle('open'); }

/* ════════════════════════════════════════
   LETTER SIDEBAR
════════════════════════════════════════ */
const COLORS=["#FF3CAC","#784BA0","#2B86C5","#F7971E","#FFD200","#00C9FF","#92FE9D","#FC466B","#3F5EFB","#43E97B","#F953C6","#FF6B6B"];
let letterCounts={};
let sandboxItems=0;

function onNameChange(){
  const name=document.getElementById('nameInput').value;
  document.getElementById('createBtn').disabled=!name.trim();
  updateLetterRows(name);
}

function updateLetterRows(name){
  const unique=[...new Set(name.toUpperCase().replace(/\s/g,'').split(''))].filter(Boolean);
  const wrap=document.getElementById('lettersWrap');
  const section=document.getElementById('lettersSection');
  if(!unique.length){wrap.style.display='none';return;}
  wrap.style.display='flex';wrap.style.flexDirection='column';wrap.style.gap='5px';
  unique.forEach(l=>{if(letterCounts[l]===undefined)letterCounts[l]=5;});
  Object.keys(letterCounts).forEach(l=>{if(!unique.includes(l))delete letterCounts[l];});
  const frag=document.createDocumentFragment();
  const suffix=T[lang].letterSuffix;
  unique.forEach((letter,i)=>{
    const color=COLORS[i%COLORS.length];
    const row=document.createElement('div');row.className='letter-row';
    row.innerHTML=`
      <div class="lbadge" style="background:${color}">${letter}</div>
      <span class="lname">"${letter}"${suffix}</span>
      <div class="count-ctrl">
        <button class="cbtn" onclick="chCount('${letter}',-1)">−</button>
        <input class="cinput" id="cnt-${letter}" type="number" min="1" max="50" value="${letterCounts[letter]}" oninput="setCount('${letter}',this.value)">
        <button class="cbtn" onclick="chCount('${letter}',1)">+</button>
      </div>`;
    frag.appendChild(row);
  });
  section.innerHTML='';
  section.appendChild(frag);
}
function setCount(l,v){let n=parseInt(v);if(isNaN(n)||n<1)n=1;if(n>50)n=50;letterCounts[l]=n;}
function chCount(l,d){
  letterCounts[l]=Math.min(50,Math.max(1,(letterCounts[l]||5)+d));
  const el=document.getElementById('cnt-'+l);if(el)el.value=letterCounts[l];
}

/* ════════════════════════════════════════
   DRAG — RAF-based, no layout thrashing
════════════════════════════════════════ */
let drag=null;
let pendingX=0, pendingY=0, dragRaf=null;

function applyDrag(){
  dragRaf=null;
  if(!drag)return;
  drag.el.style.left=pendingX+'px';
  drag.el.style.top=pendingY+'px';
}

function onMove(cx,cy){
  if(!drag)return;
  const sb=document.getElementById('sandbox');
  const r=sb.getBoundingClientRect();
  pendingX=Math.max(0,Math.min(sb.clientWidth-drag.el.offsetWidth,  cx-r.left-drag.offX));
  pendingY=Math.max(0,Math.min(sb.clientHeight-drag.el.offsetHeight, cy-r.top -drag.offY));
  if(!dragRaf) dragRaf=requestAnimationFrame(applyDrag);
}
function onUp(){
  if(drag){drag.el.classList.remove('dragging');drag=null;}
  if(dragRaf){cancelAnimationFrame(dragRaf);dragRaf=null;}
}

document.addEventListener('mousemove',e=>onMove(e.clientX,e.clientY));
document.addEventListener('mouseup',onUp);
document.addEventListener('touchmove',e=>{
  if(!drag)return;
  e.preventDefault();
  onMove(e.touches[0].clientX,e.touches[0].clientY);
},{passive:false});
document.addEventListener('touchend',onUp);

function makeDraggable(el){
  el.addEventListener('mousedown',e=>{
    e.preventDefault();
    const r=el.getBoundingClientRect();
    drag={el,offX:e.clientX-r.left,offY:e.clientY-r.top};
    el.classList.add('dragging');
  });
  el.addEventListener('touchstart',e=>{
    const t=e.touches[0],r=el.getBoundingClientRect();
    drag={el,offX:t.clientX-r.left,offY:t.clientY-r.top};
    el.classList.add('dragging');
  },{passive:true});
}

/* ════════════════════════════════════════
   SPAWN OBJECT
════════════════════════════════════════ */
function spawnObject(icon,name){
  const sb=document.getElementById('sandbox');
  const x=80+Math.random()*(sb.clientWidth-200);
  const y=60+Math.random()*(sb.clientHeight-160);
  const el=document.createElement('div');
  el.className='sb-obj';
  el.style.cssText=`left:${x}px;top:${y}px`;
  el.innerHTML=`<span style="font-size:40px;pointer-events:none">${icon}</span><div class="obj-label">${name}</div>`;
  makeDraggable(el);
  sb.appendChild(el);
  sandboxItems++;
  document.getElementById('sbHint').style.opacity='0';
  updateExplodeAll();
}

/* ════════════════════════════════════════
   BOMBS
════════════════════════════════════════ */
const bombs=new Map();

function createBomb(){
  const name=document.getElementById('nameInput').value.trim();
  if(!name)return;
  const unique=[...new Set(name.toUpperCase().replace(/\s/g,'').split(''))].filter(Boolean);
  const snap={};
  unique.forEach((l,i)=>{snap[l]={count:letterCounts[l]||5,color:COLORS[i%COLORS.length]};});

  const sb=document.getElementById('sandbox');
  const x=60+Math.random()*(sb.clientWidth-180);
  const y=60+Math.random()*(sb.clientHeight-180);

  const bomb=document.createElement('div');
  bomb.className='bomb';
  bomb.style.cssText=`left:${x}px;top:${y}px`;
  bomb.innerHTML=`
    <div class="bomb-body">
      <div class="bomb-fuse"></div><div class="bomb-spark">✨</div><div class="bomb-shine"></div>
      <span style="font-size:26px;z-index:1;position:relative;pointer-events:none">💣</span>
    </div>
    <div class="bomb-label">${name.toUpperCase()}</div>
    <div style="font-family:'Nunito',sans-serif;font-size:9px;color:#ffffff44;margin-top:-2px;pointer-events:none">${lang==='tr'?'✋ sürükle · 👆 patlat':'✋ drag · 👆 click to boom'}</div>`;

  let mouseDownTime=0;
  let startPos={x:0,y:0};
  bomb.addEventListener('mousedown',e=>{
    e.preventDefault();
    mouseDownTime=Date.now();
    startPos={x:e.clientX,y:e.clientY};
    const r=bomb.getBoundingClientRect();
    drag={el:bomb,offX:e.clientX-r.left,offY:e.clientY-r.top};
    bomb.classList.add('dragging');
  });
  bomb.addEventListener('touchstart',e=>{
    mouseDownTime=Date.now();
    const t=e.touches[0];
    startPos={x:t.clientX,y:t.clientY};
    const r=bomb.getBoundingClientRect();
    drag={el:bomb,offX:t.clientX-r.left,offY:t.clientY-r.top};
    bomb.classList.add('dragging');
  },{passive:true});
  bomb.addEventListener('click',e=>{
    const moved=Math.hypot(e.clientX-startPos.x,e.clientY-startPos.y);
    if(Date.now()-mouseDownTime<350 && moved<8) detonateBomb(bomb,snap);
  });

  document.getElementById('sandbox').appendChild(bomb);
  bombs.set(bomb,snap);
  sandboxItems++;
  document.getElementById('sbHint').style.opacity='0';
  updateExplodeAll();
}

function updateExplodeAll(){
  document.getElementById('explodeAllBtn').disabled=bombs.size===0;
}
function explodeAll(){
  if(!bombs.size)return;
  [...bombs.entries()].forEach(([bomb,snap],i)=>{
    setTimeout(()=>detonateBomb(bomb,snap),i*110);
  });
}

/* ════════════════════════════════════════
   DETONATE
════════════════════════════════════════ */
function detonateBomb(bomb,snap){
  if(!bomb.isConnected)return;
  const rect=bomb.getBoundingClientRect();
  const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;

  doFlash(cx,cy);
  spawnParticles(cx,cy,snap);

  // Shake nearby objects (batch getBoundingClientRect reads first)
  const objs=[...document.querySelectorAll('.sb-obj')];
  const rects=objs.map(o=>o.getBoundingClientRect());
  objs.forEach((obj,i)=>{
    const or=rects[i];
    const ox=or.left+or.width/2, oy=or.top+or.height/2;
    if(Math.hypot(ox-cx,oy-cy)<260){
      obj.style.transition='transform 0.08s';
      obj.style.transform='scale(1.25) rotate(12deg)';
      setTimeout(()=>{obj.style.transform='scale(1) rotate(-8deg)';},100);
      setTimeout(()=>{obj.style.transform='';obj.style.transition='';},220);
    }
  });

  bomb.style.transition='transform 0.12s,opacity 0.12s';
  bomb.style.transform='scale(2.5)';
  bomb.style.opacity='0';
  setTimeout(()=>{
    bomb.remove();
    bombs.delete(bomb);
    sandboxItems--;
    updateExplodeAll();
    if(sandboxItems<=0) document.getElementById('sbHint').style.opacity='1';
  },140);
}

// Init
setLang('tr');
</script>
